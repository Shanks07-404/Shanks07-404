name: Build README

on:
  schedule:
    - cron: "40 0 * * *"   # daily, after the snake workflow
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-readme.yml"

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install fonttools brotli
      - name: Fetch fonts
        run: |
          mkdir -p /tmp/fonts && cd /tmp/fonts
          npm pack @fontsource/sora@5 @fontsource/jetbrains-mono@5 --silent
          for f in *.tgz; do d="${f%%-[0-9]*}"; mkdir -p "$d"; tar xzf "$f" -C "$d" --strip-components=1; done
          ls /tmp/fonts
      - name: Build README and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FONT_DIR: /tmp/fonts
        run: python build/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "chore: rebuild README cards"
          git push
